[build-system]
requires = ["setuptools>=61.0", "wheel>=0.38"]
build-backend = "setuptools.build_meta"

[project]
name = "mineralco"
version = "1.0.0"
description = "MINERALCO - Seven Parameters to Decode the Earth's Solid Interior"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Samir Baladi", email = "gitdeeper@gmail.com"}
]
keywords = [
    "mineral-physics", "equation-of-state", "crystallography",
    "high-pressure", "mantle", "birch-murnaghan", "gruneisen-parameter"
]

[project.urls]
Homepage = "https://github.com/gitedeeper9/mineralco"
Documentation = "https://mineralco.netlify.app/docs"
Repository = "https://github.com/gitedeeper9/mineralco.git"
DOI = "https://doi.org/10.5281/zenodo.19009597"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
