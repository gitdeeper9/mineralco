# MINERALCO Setup Configuration
# Mineral Intelligence Network for Equation-of-state Research, Atomic Lattice COmputation
# Version: 1.0.0 | DOI: 10.5281/zenodo.19009597

[metadata]
name = mineralco
version = 1.0.0
author = Samir Baladi
author_email = gitdeeper@gmail.com
maintainer = Samir Baladi
maintainer_email = gitdeeper@gmail.com
description = MINERALCO: Seven Parameters to Decode the Earth's Solid Interior
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/gitedeeper9/mineralco
download_url = https://github.com/gitedeeper9/mineralco/archive/v1.0.0.tar.gz
project_urls =
    Documentation = https://mineralco.netlify.app/docs
    Source = https://github.com/gitedeeper9/mineralco
    Bug Reports = https://github.com/gitedeeper9/mineralco/issues
    Discussion = https://github.com/gitedeeper9/mineralco/discussions
    DOI = https://doi.org/10.5281/zenodo.19009597
    Web Dashboard = https://mineralco.netlify.app
license = MIT
license_file = LICENSE
platforms = any
keywords =
    mineral-physics,
    equation-of-state,
    crystallography,
    high-pressure,
    mantle,
    birch-murnaghan,
    gruneisen-parameter,
    bulk-modulus,
    phase-transitions,
    earth-interior,
    computational-mineralogy,
    open-source,
    scientific-computing,
    python,
    synchrotron,
    dac,
    bridgmanite,
    olivine,
    perovskite

classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Science/Research
    Intended Audience :: Education
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Operating System :: POSIX :: Linux
    Operating System :: MacOS :: MacOS X
    Operating System :: Microsoft :: Windows
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: Implementation :: CPython
    Topic :: Scientific/Engineering
    Topic :: Scientific/Engineering :: Physics
    Topic :: Scientific/Engineering :: Geology
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Software Development :: Libraries :: Python Modules

[options]
zip_safe = False
include_package_data = True
packages = find:
python_requires = >=3.9, <3.12
setup_requires =
    setuptools>=61.0
    wheel>=0.38
    cython>=0.29.0
install_requires =
    numpy>=1.24.0
    scipy>=1.10.0
    pandas>=2.0.0
    xarray>=2023.4.0
    numba>=0.57.0
    sympy>=1.11.1
    matplotlib>=3.7.0
    plotly>=5.14.0
    seaborn>=0.12.0
    h5py>=3.8.0
    netCDF4>=1.6.0
    pyyaml>=6.0
    python-dotenv>=1.0.0
    requests>=2.30.0
    tqdm>=4.65.0
    click>=8.1.0
    joblib>=1.2.0
    scikit-learn>=1.2.0
    statsmodels>=0.14.0
    colorama>=0.4.6

[options.packages.find]
include =
    mineralco
    mineralco.*
exclude =
    tests
    tests.*
    docs
    docs.*
    examples
    examples.*
    notebooks
    notebooks.*

[options.extras_require]
dev =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-xdist>=3.0.0
    black>=23.0.0
    isort>=5.0.0
    flake8>=6.0.0
    pylint>=2.0.0
    mypy>=1.0.0
    pre-commit>=3.0.0
    ipython>=8.0.0
    jupyter>=1.0.0

docs =
    sphinx>=7.0.0
    sphinx-rtd-theme>=1.2.0
    sphinx-autodoc-typehints>=1.23.0
    sphinx-gallery>=0.13.0
    nbsphinx>=0.9.0
    mkdocs>=1.4.0
    mkdocs-material>=9.0.0
    mkdocstrings[python]>=0.22.0
    pymdown-extensions>=10.0.0

test =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-xdist>=3.0.0
    hypothesis>=6.0.0

web =
    flask>=2.3.0
    flask-cors>=4.0.0
    dash>=2.9.0
    dash-bootstrap-components>=1.4.0
    gunicorn>=20.1.0

all =
    %(dev)s
    %(docs)s
    %(test)s
    %(web)s

[options.entry_points]
console_scripts =
    mineralco = mineralco.cli.main:cli
    mineralco-init = mineralco.cli.init:main
    mineralco-download = mineralco.cli.download:main
    mineralco-process = mineralco.cli.process:main
    mineralco-csi = mineralco.cli.csi:main
    mineralco-serve = mineralco.cli.serve:main
    mineralco-diagnostic = mineralco.cli.diagnostic:main
    mineralco-validate = mineralco.cli.validate:main
    mineralco-report = mineralco.cli.report:main
    mineralco-plot = mineralco.cli.plot:main
    mineralco-config = mineralco.cli.config:main

mineralco.physics =
    bm3_eos = mineralco.physics.bm3:BirchMurnaghanEOS
    mie_gruneisen = mineralco.physics.mie_gruneisen:MieGruneisenCorrection
    crystal_symmetry = mineralco.physics.symmetry:CrystalSymmetry
    gruneisen = mineralco.physics.gruneisen:GruneisenParameter
    thermal_expansion = mineralco.physics.thermal:ThermalExpansion
    lattice_energy = mineralco.physics.lattice:BornLandeEnergy
    csi = mineralco.physics.csi:CrystalStabilityIndex

mineralco.data =
    mineral_db = mineralco.data.loaders.mineral_db:MineralDatabaseLoader
    synchrotron = mineralco.data.loaders.synchrotron:SynchrotronDataLoader
    dac = mineralco.data.loaders.dac:DACDataLoader

[flake8]
max-line-length = 100
extend-ignore = E203, W503
exclude = .git,__pycache__,docs,venv,.venv,env,dist,build,notebooks,data

[isort]
profile = black
line_length = 100
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
known_first_party = mineralco
known_third_party =
    numpy,
    scipy,
    pandas,
    xarray,
    matplotlib,
    plotly,
    seaborn,
    sklearn

[mypy]
python_version = 3.10
warn_return_any = True
ignore_missing_imports = True
follow_imports = silent
exclude = (build|docs|tests|examples|notebooks|data)/

[tool:pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --verbose
    --cov=mineralco
    --cov-report=term
    --cov-report=html
markers =
    slow: marks tests as slow
    integration: marks integration tests
    unit: marks unit tests
    validation: marks validation tests with experimental data

[coverage:run]
source = mineralco
omit =
    */tests/*
    */docs/*
    */examples/*
    */notebooks/*
    */setup.py

# =============================================================================
# END OF SETUP CONFIGURATION
# =============================================================================
